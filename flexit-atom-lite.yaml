substitutions:
  name: flexit-sl4r
  friendly_name: Flexit SL4R

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "Flexit SL4R (CS50/CI50) RS485-bro på M5Stack ATOM Lite + Tail485"

esp32:
  board: m5stack-atom
  framework:
    type: arduino

# USB/konsoll-logging på standard UART0 — kolliderer ikke med RS485-bussen,
# som kjører på en egen UART (se uart: nedenfor, G26/G32 via Tail485).
logger:

api:
  encryption:
    key: !secret flexit_sl4r_api_key

ota:
  - platform: esphome
    password: !secret flexit_sl4r_ota_password

wifi:
  ssid: !secret wifi_iot_ssid
  password: !secret wifi_iot_password
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

external_components:
  - source:
      type: local
      path: components

# ATOM Tail485 (SP485EEN-L) kobles til ATOM Lites bakkontakt: G26=TX, G32=RX.
# Verifisert mot M5Stacks PinMap for SKU T002 — se research/protocol-notes.md
# → «Fysisk tilkobling».
# rx_buffer_size MÅ være romslig — CS50 sender data raskt nok til at
# standard 64-byte-buffer flommer over i løpet av sekunder.
uart:
  id: flexit_uart
  tx_pin: GPIO26
  rx_pin: GPIO32
  baud_rate: 19200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 2048
  # FEILSØKING: fjern kommentaren under for å logge hver mottatte byte som hex.
  # Dette er verktøyet som skiller de tre feilene fra hverandre når
  # «Kommunikasjon OK» ikke blir `on`:
  #   - helt tomt         → A/B byttet om, eller feil pinne i 4P4C-en
  #   - hex strømmer inn  → ledningen er riktig, synkroniseringen treffer ikke
  # Bruk også `logger: level: VERY_VERBOSE` sammen med denne ved behov.
  # Skru AV igjen etterpå — den spammer loggen og stjeler CPU fra loop().
  # debug:
  #   direction: RX
  #   dummy_receiver: false
  #   after:
  #     bytes: 32
  #     timeout: 100ms
  #   sequence:
  #     - lambda: UARTDebug::log_hex(direction, bytes, ' ');

# Diagnostikk. `reset_reason` avgjør spørsmålet om bussens strømkapasitet:
# viser den «Brownout», er skinnen for svak til ESP32-ens toppforbruk og
# noden må mates fra USB-C i stedet (med klemme V frakoblet). Kortvarig blink
# på styreenheten i det pluggen settes i er derimot normal innkoblingsstrøm
# fra Tail485s inngangskondensator, og gir ingen reset.
# Uptime avslører skjulte restarter: står den og teller opp fra null, er noden
# i en boot-loop selv om HA rekker å vise den som tilkoblet.
debug:
  update_interval: 60s

text_sensor:
  - platform: debug
    reset_reason:
      name: "Resetårsak"

flexit_sl4r:
  id: flexit_sl4r_hub
  uart_id: flexit_uart
  # Hvilken node vi utgir oss for å være ved sending. CI50 er node 4 (panel 1).
  # Node 5 er panel 2 — det er dét dipswitch 3 på panelet konfigurerer.
  # Adressefeltet beregnes automatisk: byte 3-4 er Fletcher-sjekksummen over
  # [C3, node, 00], verifisert mot node 1 (01 00 C4 4B) og node 4 (04 00 C7 51).
  # Å opptre som node 4 betyr å utgi seg for det ekte panelet; node 5 er en
  # egen identitet CS50 er bygget for å støtte.
  # Tilbake på 4 (panelets identitet) — node 5 er prøvd og gir ingen reaksjon.
  # Bussen er POLLED: masteren sender 5 byte `C3 <node> 00 <cks>`, og kun den
  # adresserte noden svarer — UTEN å gjenta C3-headeren. Node 2/3/5 pollast fem
  # ganger hver ved oppstart (enumerering); svarer de ikke, droppes de.
  # Vi melder oss derfor på som node 5 = panel 2.
  source_node: 5
  respond_to_polls: true
  # Retningsstyring: blokkdiagrammet i M5Stacks datablad for Tail RS485 (SKU
  # T002) viser kun fire signaler mellom modulen og ATOM-en — G/5V/TXD/RXD.
  # Det finnes ingen DE/RE-linje ut av modulen, så retningen styres på kortet.
  # flow_control_pin skal derfor stå UKONFIGURERT. Se
  # research/protocol-notes.md punkt 1.
  #
  # Skriving skjer som POLL-SVAR, ikke som frittstående telegram. Se
  # research/protocol-notes.md → «GJENNOMBRUDD: bussen er POLLED».
  # Den gamle `command_template`-nøkkelen er fjernet: den beskrev poll og svar
  # som én ramme, og inkluderte dermed pollen — som tilhører masteren.

select:
  - platform: flexit_sl4r
    flexit_sl4r_id: flexit_sl4r_hub
    fan_level:
      name: "Viftetrinn"

# Forvarme-bryteren er FJERNET. CS 50-manualen er entydig: forvarme er en
# plateveksler-funksjon (mikrobryter 3: «bare ved plateveksler»), og SL4 R har
# roterende veksler — avfrosting skjer med bypass. Bryteren kunne aldri virke.
switch:
  # --- FEILSØKING AV SENDEVEIEN ---
  # Slå på for å sende kontinuerlig, slik at et multimeter rekker å sette seg.
  # Se research/protocol-notes.md → «Multimetermåling av sendeveien».
  # Slå AV igjen etterpå — den forstyrrer bussen HVIS senderen faktisk virker,
  # og det er nettopp det vi prøver å finne ut.
  # Ettervarme av/på — samme funksjon som «hold − og trykk +» på panelet.
  # Tilstanden speiles fra panelets egen ramme, så bryteren viser det panelets
  # «+»-lampe viser.
  - platform: template
    name: "Ettervarme"
    id: afterheat_switch
    icon: "mdi:radiator"
    # KRITISK: uten dette gjenoppretter ESPHome bryteren ved hver oppstart og
    # kaller turn_off_action — altså slår den av ettervarmen i aggregatet hver
    # gang noden booter. Tilstanden leses fra bussen, så det er ingenting å
    # gjenopprette.
    restore_mode: DISABLED
    lambda: 'return id(flexit_sl4r_hub)->get_afterheat_enabled();'
    turn_on_action:
      - lambda: 'id(flexit_sl4r_hub)->set_afterheat_enabled(true);'
    turn_off_action:
      - lambda: 'id(flexit_sl4r_hub)->set_afterheat_enabled(false);'

  # Rå logging av HVER validerte ramme. Skrus av/på i drift uten reflash —
  # det gamle `uart: debug:` krevde ny firmware hver gang. Bruk denne når du
  # skal fange en hendelse i sin helhet. Slå AV igjen etterpå; den er ordrik.
  - platform: template
    name: "Rå rammelogging"
    id: raw_logging
    restore_mode: DISABLED
    entity_category: diagnostic
    icon: "mdi:text-box-search-outline"
    lambda: 'return id(flexit_sl4r_hub)->get_raw_logging();'
    turn_on_action:
      - lambda: 'id(flexit_sl4r_hub)->set_raw_logging(true);'
    turn_off_action:
      - lambda: 'id(flexit_sl4r_hub)->set_raw_logging(false);'

  - platform: template
    name: "TX-test (feilsøking)"
    id: tx_test
    restore_mode: DISABLED
    optimistic: true
    entity_category: diagnostic
    icon: "mdi:test-tube"

interval:
  - interval: 20ms
    then:
      - if:
          condition:
            switch.is_on: tx_test
          then:
            # 16 nullbyte hver 20 ms ≈ 40 % duty. Nullbyte gir mest tid i
            # space-tilstand og dermed størst utslag på en DC-måling.
            - lambda: |-
                static const uint8_t pattern[16] = {0};
                id(flexit_uart).write_array(pattern, 16);

# Forsering («Max vifte» — dusj/matlaging). Dette er den ENESTE sendefunksjonen
# som er aktivert, fordi den er den eneste vi har fanget og verifisert komplett
# fra bussen (2026-08-13). Aggregatet går til trinn 3 og faller selv tilbake
# til forrige trinn når perioden er over — vi trenger derfor ingen «av»-kommando.
button:
  - platform: flexit_sl4r
    flexit_sl4r_id: flexit_sl4r_hub
    boost:
      name: "Forsering"
      icon: "mdi:fan-plus"
    # Dumper de første 6 kB fra bussen etter oppstart. Registreringen av
    # paneler skjer i løpet av sekunder etter at CS50 får strøm — lenge før
    # WiFi og API er oppe — så den må bufres i RAM og hentes ut etterpå.
    dump_boot_capture:
      name: "Dump oppstartsfangst"
      icon: "mdi:content-save-outline"
      entity_category: diagnostic
    # Skriver ut de siste 40 uventede hendelsene med full ramme. Trykk denne
    # etter at noe har skjedd — en alarm, en uforklarlig endring — og lim
    # loggen inn i en GitHub-issue.
    # Nullstiller filtervakttimeren med hele prosedyren automatisk: settpunkt
    # til 20 grader, reset-flagget, og deretter tilbake til settpunktet du
    # hadde. Manualens 20-graders-steg er nødvendig — uten det blir alarmen
    # bare midlertidig kvittert mens timeren fortsetter å telle.
    # BRUK KUN NÅR FILTERET FAKTISK ER BYTTET.
    reset_filter:
      name: "Nullstill filtervakt"
      icon: "mdi:air-filter"
    dump_anomalies:
      name: "Dump anomalier"
      icon: "mdi:bug-outline"
      entity_category: diagnostic

number:
  - platform: flexit_sl4r
    flexit_sl4r_id: flexit_sl4r_hub
    heat_exchanger_setpoint:
      name: "Settpunkt varmeveksler"

sensor:
  - platform: uptime
    name: "Oppetid"
    entity_category: diagnostic

  - platform: flexit_sl4r
    flexit_sl4r_id: flexit_sl4r_hub
    # Eneste tilkoblede temperaturføler på bussen — Flexits B1, «tilluftføler
    # ettervarme». Identifisert 2026-08-14 ved korrelasjon mot Z-Wave-følerne
    # i kanalen. Avtrekk/avkast/uteluft finnes IKKE på bussen.
    supply_air_temperature:
      name: "Tilluft"
    # Samme settpunkt som number-entiteten, men som float rett fra bussen.
    # Nyttig som kryssjekk på at byte- og float-representasjonen følges ad.
    heat_exchanger_setpoint_raw:
      name: "Settpunkt (buss)"
    fan_duty_supply:
      name: "Viftepådrag tilluft"
      icon: "mdi:fan"
    fan_duty_extract:
      name: "Viftepådrag avtrekk"
      icon: "mdi:fan"
    # payload[11] — varmepådrag som regulerer rotorens hastighet (Flexit:
    # J5 pin 11,12, «0-10 V, 10 V ved maks varmebehov»). Sto konstant 0 til vi
    # provoserte fram varmebehov ved å sette settpunktet til maks; da rampet
    # den monotont oppover. Skala antatt 0-100.
    heat_demand:
      name: "Varmepådrag"
      icon: "mdi:heat-wave"
    fan_level_running:
      name: "Viftetrinn kjørende"
    fan_level_return:
      name: "Viftetrinn retur"
    # Teller rammer som feilet sjekksum. Stiger den mens TX-testen står på,
    # ØDELEGGER vi CS50s trafikk — og da driver vi beviselig bussen.
    frames_discarded:
      name: "Rammer forkastet"
    # Hvor ofte statustelegrammet faktisk kommer. Lagt inn for å svare på
    # hvorfor «Kommunikasjon OK» hang seg opp da den var bundet til nettopp
    # den telegramtypen.
    status_interval:
      name: "Statusintervall"
    # Teller uventede hendelser: nye rammetyper, endringer i felt vi tror er
    # konstante, og enhver endring i alarmfeltet. Stiger den, har aggregatet
    # gjort noe vi ikke har sett før — og rammen ligger lagret.
    anomalies:
      name: "Anomalier"

    # --- Utforskning ---
    # Ukjente felt eksponert som diagnostikk, slik at HAs recorder bygger
    # historikk vi kan korrelere mot senere. Da kan hypoteser prøves mot uker
    # med data i stedet for et nytt uart-debug-opptak. Se TODO.md.
    raw_status_bytes:
      - index: 4
        name: "Rå status[4]"
      - index: 6
        name: "Rå status[6] (ettervarme?)"
      - index: 10
        name: "Rå status[10]"
      - index: 15
        name: "Rå status[15]"
      - index: 20
        name: "Rå status[20]"
    # De to ledige følerinngangene: -55 betyr «ikke tilkoblet». Kobles det en
    # føler til CS50 senere, dukker den opp her uten kodeendring.
    float_registers:
      - register: 0
        slot: 0
        name: "Ledig følerinngang 1"
      - register: 0
        slot: 4
        name: "Ledig følerinngang 2"

binary_sensor:
  - platform: flexit_sl4r
    flexit_sl4r_id: flexit_sl4r_hub
    # Ettervarme = el-batteriet som varmer tillufta opp til settpunktet.
    # Het tidligere «Forvarme», som var arvet fra Vongraven og feil: forvarme
    # er en plateveksler-funksjon og finnes ikke på et rotoraggregat.
    # payload[6] bit0 — elementet varmer akkurat nå (panelets «°C»-lampe)
    afterheat_active:
      name: "Ettervarme aktiv"
    # payload[6] bit7 invertert — aktivert av bruker (panelets «+»-lampe).
    # Slås av/på ved å holde inne − og trykke + på panelet.
    afterheat_enabled:
      name: "Ettervarme aktivert"
    # payload[4] bit1 — filtertiden er utløpt. CS 50 har ingen trykkvakt;
    # alarmen er tidsbasert og nullstilles på panelet.
    filter_alarm:
      name: "Filteralarm"
    # payload[2] bit0 — settes når varmepådraget passerer ~10, altså når rotoren
    # faktisk begynner å snurre. Ikke det samme som «det finnes et varmebehov»:
    # pådraget starter først, biten kommer ved terskelen.
    heat_recovery_active:
      name: "Varmegjenvinner går"
    # payload[2] bit1 — ANTATT bypass, aldri observert satt i 837 telegram.
    # Flexit bruker samme utgang til «rotor eller bypass motor», så gruppa er
    # trolig generisk: bit0 = rotor går, bit1 = bypass på plateveksleraggregat.
    # Vi har rotor, så den skal stå `off` hos oss. Vippes den, logges den også
    # som anomali med full ramme.
    bypass_active:
      name: "Bypass (antatt)"
    communication:
      name: "Flexit-kommunikasjon OK"
    boost_active:
      name: "Forsering aktiv"
    # Blir vi fortsatt pollet av CS50? Enumereringen skjer KUN ved aggregatets
    # oppstart. Er noden nede da, droppes vi — og skriving feiler STILLE.
    # Går denne av, må aggregatet strømsykles for å slippe oss inn igjen.
    enumerated:
      name: "Enumerert på bussen"
